modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    install:
      packages:
        - patch

  - type: revert-hostname-fix
    source: local
    option: true

  - type: dnf
    repos:
      copr:
      - ligenix/enterprise-glpi10
    install:
      packages:
        - glpi-agent

  - type: dnf
    remove:
      packages:
        - patch
